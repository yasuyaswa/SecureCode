<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Code Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="background-animation"></div>
    
    <div class="card">
        <!-- Header -->
        <div class="card-header">
            <div class="header-content">
                <div class="icon-badge">🔐</div>
                <h1>Secret Code</h1>
                <p class="subtitle">Generate secure codes instantly</p>
            </div>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Form Section -->
        <div class="form-section">
            <!-- First Code Input -->
            <div class="field">
                <div class="field-header">
                    <label>First Code</label>
                    <span class="char-count" id="charCount">0 characters</span>
                </div>
                <div class="input-wrapper">
                    <input type="text" id="code1" placeholder="Enter text..." />
                    <span class="input-icon">📝</span>
                </div>
            </div>

            <!-- Second Code Input -->
            <div class="field">
                <div class="field-header">
                    <label>Second Code</label>
                    <span class="field-hint">0-100 supported</span>
                </div>
                <div class="input-wrapper">
                    <input type="number" id="code2" placeholder="Enter number..." min="0" max="100" />
                    <span class="input-icon">🔢</span>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="button-group">
            <button id="processBtn" class="btn-primary" onclick="process()">
                <span class="btn-text">Generate Code</span>
                <span class="btn-icon">→</span>
            </button>
            <button class="btn-secondary" onclick="resetAll()">Reset</button>
        </div>

        <!-- Result Section -->
        <div class="result" id="result" hidden>
            <div class="result-container">
                <div class="result-header">
                    <div class="status-badge">
                        <span id="statusIcon" aria-hidden="true"></span>
                    </div>
                    <div class="status-text">
                        <span id="statusText"></span>
                    </div>
                </div>

                <div class="output-wrapper">
                    <label class="output-label">Your Secret Code</label>
                    <div class="output" id="output"></div>
                </div>

                <div class="result-actions">
                    <button class="btn-action copy-btn" id="copyBtn" onclick="copy()" disabled>
                        <span class="action-icon">📋</span>
                        <span>Copy</span>
                    </button>
                    <span class="copied" id="copied">✓ Copied</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
